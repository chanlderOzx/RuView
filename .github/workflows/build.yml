name: Build ESP32-S3 Firmware

description: Build ESP32-S3 firmware with DEBUG log level

on:
  push:
    branches: [main, master]
    paths:
      - 'firmware/esp32-csi-node/**'
  workflow_dispatch:
    inputs:
      chip:
        description: 'Target chip'
        type: choice
        options: [esp32s3, esp32c6, esp32]
        default: 'esp32s3'
      log_level:
        description: 'Log verbosity'
        type: choice
        options: ['INFO', 'DEBUG', 'VERBOSE', 'NONE']
        default: 'DEBUG'

env:
  IDF_VERSION: v5.3
  CHIP: ${{ github.event.inputs.chip || 'esp32s3' }}
  LOG_LEVEL: ${{ github.event.inputs.log_level || 'DEBUG' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up ESP-IDF (using Docker directly)
      run: |
        docker pull espressif/idf:${{ env.IDF_VERSION }}
        echo "IDF_PATH=/opt/esp/idf" >> $GITHUB_ENV
        echo "/opt/esp/idf/tools" >> $GITHUB_PATH
        echo "/opt/esp/.espressif/python_env/idf5.3_py3.11_env/bin" >> $GITHUB_PATH

    - name: Configure log level
      run: |
        cd firmware/esp32-csi-node
        echo "CONFIG_LOG_DEFAULT_LEVEL=${{ env.LOG_LEVEL }}" >> sdkconfig.defaults
        echo "CONFIG_LOG_MAXIMUM_LEVEL=${{ env.LOG_LEVEL }}" >> sdkconfig.defaults
        echo "CONFIG_COMPILER_OPTIMIZATION_DEBUG=y" >> sdkconfig.defaults

    - name: Build firmware
      run: |
        cd firmware/esp32-csi-node
        docker run --rm -v "$(pwd):/project" -w /project \
          -e IDF_PATH=/opt/esp/idf \
          espressif/idf:${{ env.IDF_VERSION }} \
          bash -c "idf.py set-target ${{ env.CHIP }} && idf.py build"
        
    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{{env.CHIP }}-{{{env.LOG_LEVEL }}
        path: |
          firmware/esp32-csi-node/build/*.bin
          firmware/esp32-csi-node/build/bootloader/*.bin
          firmware/esp32-csi-node/build/partition_table/*.bin
         retention-days: 30

    - name: Create release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          firmware/esp32-csi-node/build/*.bin
          firmware/esp32-csi-node/build/bootloader/*.bin
          firmware/esp32-csi-node/build/partition_tabel/*.bin
        generate_release_notes: true